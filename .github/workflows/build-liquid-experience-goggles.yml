name: Build Liquid Experience Goggles

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'liquid-experience-goggles/**'
      - '.github/workflows/build-liquid-experience-goggles.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liquid-experience-goggles

    steps:
      - uses: actions/checkout@v4

      # ForgeGradle 5 does not run on JDKs newer than 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle and ForgeGradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-forgegradle-${{ hashFiles('liquid-experience-goggles/*.gradle', 'liquid-experience-goggles/gradle.properties') }}
          restore-keys: ${{ runner.os }}-forgegradle-

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Show what was produced
        run: ls -la build/libs

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: liquid-experience-goggles-jar
          path: liquid-experience-goggles/build/libs/*.jar
          if-no-files-found: error

      # The artifact download resolves to Azure blob storage, which the authoring
      # sandbox cannot reach. Publishing the jar onto a dedicated branch makes it
      # retrievable over plain git, which is reachable. The branch holds only the
      # latest build and is force-pushed each time, so no binary history accumulates.
      - name: Publish jar to artifact branch
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          echo "Publishing $(basename "$JAR") ($(stat -c%s "$JAR") bytes)"
          sha256sum "$JAR"

          TMP=$(mktemp -d)
          cp "$JAR" "$TMP/"
          sha256sum "$JAR" | sed 's#.*/##' > "$TMP/SHA256SUMS"

          cd "$TMP"
          git init -q
          git checkout -q -b build/liquid-experience-goggles-jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            build/liquid-experience-goggles-jar
          echo "Pushed to branch build/liquid-experience-goggles-jar"
