buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath group: 'org.parchmentmc', name: 'librarian', version: '1.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'java'

group = mod_group
version = "${minecraft_version}-${mod_version}"
archivesBaseName = "liquid-experience-goggles"

// ForgeGradle 5 / Forge 40 for 1.18.2 requires a Java 17 toolchain.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_version}-${minecraft_version}"
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            arg '-mixin.config=expgoggles.mixins.json'
            mods { expgoggles { source sourceSets.main } }
        }
        // No dedicated server run: this mod is client-only and does nothing on a server.
    }
}

// Forge is the only dependency. Nothing here imports a Create class — the goggle hooks
// name their target as a string and tooltips are built from vanilla components — so the
// build never needs Create on the classpath. That is exactly what lets a single jar serve
// every Create release for this Minecraft version.
//
// To try it in a dev client, run `gradlew runClient` once and drop Create and Create:
// Enchantment Industry into the generated run/mods folder.
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

// Mixin's annotation processor is deliberately not applied. Every injection here is
// remap = false against Create's own (unobfuscated) method, so no refmap is needed, and
// the processor cannot resolve string targets for a Create that is not on the classpath.
// Vanilla member references in the rest of the mod are still remapped by reobfJar below.

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replacements = [
        mod_id     : mod_id,
        mod_name   : mod_name,
        mod_version: mod_version,
        mod_license: mod_license,
    ]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') { expand replacements }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'lemzher',
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'Implementation-Vendor'   : 'lemzher',
            'MixinConfigs'            : 'expgoggles.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}
