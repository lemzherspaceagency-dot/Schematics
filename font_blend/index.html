<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8" />
<title>Šriftų maišyklė — Alyvų g. 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #fafafa;
    color: #111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .card { background: #1c1c1c !important; border-color: #333 !important; }
    input[type=text] { background: #222; color: #eee; border-color: #444; }
  }
  h1 { font-size: 1.4rem; }
  p.sub { opacity: .75; margin-top: -.5rem; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; font-weight: 600; margin-bottom: .3rem; }
  input[type=text], input[type=range], select { width: 100%; padding: .35rem; }
  select { padding: .5rem; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { select { background: #222; color: #eee; border-color: #444; } }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  canvas { background: #fff; border: 1px solid #ccc; border-radius: 6px; max-width: 100%; }
  .canvases { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .canvases figure { margin: 0; text-align: center; }
  figcaption { font-size: .85rem; opacity: .7; margin-top: .3rem; }
  button {
    background: #6b4e9a; color: #fff; border: 0; border-radius: 6px;
    padding: .55rem 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: .85rem; opacity: .75; min-height: 1.2em; }
</style>
</head>
<body>

<h1>Šriftų maišyklė</h1>
<p class="sub">Sumaišyk dviejų žmonių rašysenos (ar bet kokius) šriftus į vieną simbolį — pvz., raidę iš „Alyvų g. 4“.</p>

<div class="card">
  <div class="row">
    <div>
      <label for="fontA">1-as šriftas</label>
      <select id="fontA"></select>
    </div>
    <div>
      <label for="fontB">2-as šriftas</label>
      <select id="fontB"></select>
    </div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div>
      <label for="letter">Raidė / žodis</label>
      <input type="text" id="letter" value="A" maxlength="12" />
    </div>
    <div>
      <label for="blend">Maišymo santykis (0 = 1-as šriftas, 1 = 2-as šriftas)</label>
      <input type="range" id="blend" min="0" max="100" value="50" />
      <div id="blendVal" style="text-align:center;font-size:.85rem;opacity:.75;">50%</div>
    </div>
  </div>
  <button id="renderBtn" disabled>Maišyti</button>
  <div id="status"></div>
</div>

<div class="canvases">
  <figure><canvas id="cA" width="300" height="300"></canvas><figcaption>1-as šriftas</figcaption></figure>
  <figure><canvas id="cB" width="300" height="300"></canvas><figcaption>2-as šriftas</figcaption></figure>
  <figure><canvas id="cMix" width="300" height="300"></canvas><figcaption>Mišinys (raudona = 1-as, mėlyna = 2-as, violetinė = persidengimas)</figcaption></figure>
</div>

<div class="card">
  <label>Šrifto failas</label>
  <p class="sub" style="margin:0 0 .75rem;">Kiekviena šio žodžio raidė bus sulydyta į vieną formą ir supakuota į tikrą .otf šrifto failą, kurį gali įsidiegti.</p>
  <button id="exportBtn" disabled>Atsisiųsti šriftą (.otf)</button>
  <div id="exportStatus" style="font-size:.85rem;opacity:.75;margin-top:.5rem;"></div>
</div>

<script>
const state = { fontA: null, fontB: null };
const status = document.getElementById('status');
const renderBtn = document.getElementById('renderBtn');
const blendSlider = document.getElementById('blend');
const blendVal = document.getElementById('blendVal');
const letterInput = document.getElementById('letter');

function setStatus(msg) { status.textContent = msg; }

// Curated list of Google Fonts (raw TTF files from the google/fonts repo — opentype.js
// can't decode WOFF2, which is all the fonts.googleapis.com CSS endpoint serves to browsers).
const RAW_BASE = 'https://raw.githubusercontent.com/google/fonts/main/';
const FONT_LIST = [
  ['Caveat', 'ofl/caveat/Caveat%5Bwght%5D.ttf'],
  ['Dancing Script', 'ofl/dancingscript/DancingScript%5Bwght%5D.ttf'],
  ['Pacifico', 'ofl/pacifico/Pacifico-Regular.ttf'],
  ['Shadows Into Light', 'ofl/shadowsintolight/ShadowsIntoLight.ttf'],
  ['Indie Flower', 'ofl/indieflower/IndieFlower-Regular.ttf'],
  ['Amatic SC', 'ofl/amaticsc/AmaticSC-Regular.ttf'],
  ['Courgette', 'ofl/courgette/Courgette-Regular.ttf'],
  ['Great Vibes', 'ofl/greatvibes/GreatVibes-Regular.ttf'],
  ['Kalam', 'ofl/kalam/Kalam-Regular.ttf'],
  ['Permanent Marker', 'apache/permanentmarker/PermanentMarker-Regular.ttf'],
  ['Allura', 'ofl/allura/Allura-Regular.ttf'],
  ['Reenie Beanie', 'ofl/reeniebeanie/ReenieBeanie.ttf'],
  ['Architects Daughter', 'ofl/architectsdaughter/ArchitectsDaughter-Regular.ttf'],
  ['Parisienne', 'ofl/parisienne/Parisienne-Regular.ttf'],
  ['Sacramento', 'ofl/sacramento/Sacramento-Regular.ttf'],
  ['Playfair Display', 'ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf'],
  ['Merriweather', 'ofl/merriweather/Merriweather%5Bopsz,wdth,wght%5D.ttf'],
  ['Roboto', 'ofl/roboto/Roboto%5Bwdth,wght%5D.ttf'],
  ['Montserrat', 'ofl/montserrat/Montserrat%5Bwght%5D.ttf'],
  ['Bebas Neue', 'ofl/bebasneue/BebasNeue-Regular.ttf'],
  ['Oswald', 'ofl/oswald/Oswald%5Bwght%5D.ttf'],
  ['Lobster', 'ofl/lobster/Lobster-Regular.ttf'],
  ['Cinzel', 'ofl/cinzel/Cinzel%5Bwght%5D.ttf'],
  ['Abril Fatface', 'ofl/abrilfatface/AbrilFatface-Regular.ttf'],
  ['Patrick Hand', 'ofl/patrickhand/PatrickHand-Regular.ttf'],
  ['Gochi Hand', 'ofl/gochihand/GochiHand-Regular.ttf'],
];

const fontCache = {};

async function fetchGoogleFont(family) {
  if (fontCache[family]) return fontCache[family];
  const entry = FONT_LIST.find(([name]) => name === family);
  if (!entry) throw new Error('Nežinomas šriftas');
  const res = await fetch(RAW_BASE + entry[1]);
  if (!res.ok) throw new Error('Nepavyko atsisiųsti šrifto failo (' + res.status + ')');
  const buf = await res.arrayBuffer();
  const font = opentype.parse(buf);
  fontCache[family] = font;
  return font;
}

function populateFontSelect(select) {
  for (const [family] of FONT_LIST) {
    const opt = document.createElement('option');
    opt.value = family;
    opt.textContent = family;
    select.appendChild(opt);
  }
}

function loadFontChoice(select, key, canvasId, defaultFamily) {
  populateFontSelect(select);
  select.value = defaultFamily;

  async function load() {
    const family = select.value;
    setStatus(`Kraunama: ${family}...`);
    try {
      const font = await fetchGoogleFont(family);
      state[key] = font;
      drawSingle(font, document.getElementById(canvasId));
      setStatus(`Įkelta: ${family}`);
    } catch (err) {
      setStatus('Klaida kraunant šriftą: ' + err.message);
    }
    renderBtn.disabled = !(state.fontA && state.fontB);
    if (state.fontA && state.fontB) render();
  }

  select.addEventListener('change', load);
  load();
}
loadFontChoice(document.getElementById('fontA'), 'fontA', 'cA', 'Caveat');
loadFontChoice(document.getElementById('fontB'), 'fontB', 'cB', 'Dancing Script');

function glyphMaskForFont(font, text, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#000';

  const fontSize = size * 0.7;
  const path = font.getPath(text, 0, 0, fontSize);
  const bbox = path.getBoundingBox();
  const w = bbox.x2 - bbox.x1, h = bbox.y2 - bbox.y1;
  const scale = Math.min((size * 0.8) / w, (size * 0.8) / h) || 1;
  const tx = size / 2 - (bbox.x1 + w / 2) * scale;
  const ty = size / 2 - (bbox.y1 + h / 2) * scale;

  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);
  path.fill = '#000';
  const p2d = new Path2D(path.toPathData(2));
  ctx.fill(p2d);
  ctx.restore();

  const data = ctx.getImageData(0, 0, size, size).data;
  const mask = new Uint8Array(size * size);
  for (let i = 0; i < size * size; i++) mask[i] = data[i * 4 + 3] > 127 ? 1 : 0;
  return mask;
}

function drawSingle(font, canvas) {
  const size = canvas.width;
  const mask = glyphMaskForFont(font, letterInput.value || 'A', size);
  paintMask(canvas, mask, size);
}

function paintMask(canvas, mask, size) {
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = mask[i] ? 20 : 255;
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// Double-exposure overlay: font A tinted warm, font B tinted cool, overlap reads as ink-mixed.
// This stays legible for any pair of fonts, unlike a pixel morph which only works when both
// glyphs share similar structure.
const COLOR_A = [196, 90, 60];   // warm terracotta
const COLOR_B = [60, 110, 196];  // cool blue

function paintOverlay(canvas, maskA, maskB, size, t) {
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const opA = (1 - t) * 0.85 + 0.15;
  const opB = t * 0.85 + 0.15;
  for (let i = 0; i < size * size; i++) {
    let r = 255, g = 255, b = 255;
    if (maskA[i]) {
      r = r * (1 - opA) + COLOR_A[0] * opA;
      g = g * (1 - opA) + COLOR_A[1] * opA;
      b = b * (1 - opA) + COLOR_A[2] * opA;
    }
    if (maskB[i]) {
      r = r * (1 - opB) + COLOR_B[0] * opB;
      g = g * (1 - opB) + COLOR_B[1] * opB;
      b = b * (1 - opB) + COLOR_B[2] * opB;
    }
    img.data[i * 4] = Math.round(r);
    img.data[i * 4 + 1] = Math.round(g);
    img.data[i * 4 + 2] = Math.round(b);
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function render() {
  if (!state.fontA || !state.fontB) return;
  const text = letterInput.value || 'A';
  const size = 300;
  setStatus('Skaičiuojama...');
  requestAnimationFrame(() => {
    const maskA = glyphMaskForFont(state.fontA, text, size);
    const maskB = glyphMaskForFont(state.fontB, text, size);
    paintMask(document.getElementById('cA'), maskA, size);
    paintMask(document.getElementById('cB'), maskB, size);

    const t = blendSlider.value / 100;
    paintOverlay(document.getElementById('cMix'), maskA, maskB, size, t);
    setStatus('Paruošta.');
  });
  exportBtn.disabled = false;
}

blendSlider.addEventListener('input', () => {
  blendVal.textContent = blendSlider.value + '%';
  render();
});
letterInput.addEventListener('input', render);
renderBtn.addEventListener('click', render);

// ---- Font export: merge each character's outline into one shape and pack a real .otf ----

const exportBtn = document.getElementById('exportBtn');
const exportStatus = document.getElementById('exportStatus');

// Two-pass chamfer distance transform (approximate Euclidean, good enough for a merged silhouette)
function distanceTransform(mask, size) {
  const INF = 1e6;
  const dist = new Float32Array(size * size).fill(INF);
  for (let i = 0; i < size * size; i++) if (mask[i]) dist[i] = 0;
  const at = (x, y) => dist[y * size + x];
  const set = (x, y, v) => { if (v < dist[y * size + x]) dist[y * size + x] = v; };
  const d1 = 1, d2 = Math.SQRT2;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    if (x > 0) set(x, y, at(x - 1, y) + d1);
    if (y > 0) set(x, y, at(x, y - 1) + d1);
    if (x > 0 && y > 0) set(x, y, at(x - 1, y - 1) + d2);
    if (x < size - 1 && y > 0) set(x, y, at(x + 1, y - 1) + d2);
  }
  for (let y = size - 1; y >= 0; y--) for (let x = size - 1; x >= 0; x--) {
    if (x < size - 1) set(x, y, at(x + 1, y) + d1);
    if (y < size - 1) set(x, y, at(x, y + 1) + d1);
    if (x < size - 1 && y < size - 1) set(x, y, at(x + 1, y + 1) + d2);
    if (x > 0 && y < size - 1) set(x, y, at(x - 1, y + 1) + d2);
  }
  return dist;
}

function signedDistance(mask, size) {
  const inv = new Uint8Array(size * size);
  for (let i = 0; i < size * size; i++) inv[i] = mask[i] ? 0 : 1;
  const distOutside = distanceTransform(mask, size);
  const distInside = distanceTransform(inv, size);
  const sdf = new Float32Array(size * size);
  for (let i = 0; i < size * size; i++) sdf[i] = mask[i] ? -distInside[i] : distOutside[i];
  return sdf;
}

function mergedMask(maskA, maskB, size, t) {
  const sdfA = signedDistance(maskA, size);
  const sdfB = signedDistance(maskB, size);
  const out = new Uint8Array(size * size);
  for (let i = 0; i < size * size; i++) {
    out[i] = (sdfA[i] * (1 - t) + sdfB[i] * t) <= 0 ? 1 : 0;
  }
  return out;
}

// Marching squares: trace a binary mask into closed polygon contours. Filled regions end
// up with consistent winding (outer boundaries vs. holes get opposite signed area), which
// is exactly what a font glyph outline needs.
function traceContours(mask, size) {
  const get = (x, y) => (x < 0 || y < 0 || x >= size || y >= size) ? 0 : mask[y * size + x];
  const W = size - 1, H = size - 1;
  const segs = [];
  const T = (x, y) => [x + 0.5, y], R = (x, y) => [x + 1, y + 0.5];
  const B = (x, y) => [x + 0.5, y + 1], L = (x, y) => [x, y + 0.5];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const tl = get(x, y), tr = get(x + 1, y), br = get(x + 1, y + 1), bl = get(x, y + 1);
      const state = tl * 8 + tr * 4 + br * 2 + bl * 1;
      switch (state) {
        case 1: segs.push([L(x, y), B(x, y)]); break;
        case 2: segs.push([B(x, y), R(x, y)]); break;
        case 3: segs.push([L(x, y), R(x, y)]); break;
        case 4: segs.push([R(x, y), T(x, y)]); break;
        case 5: segs.push([L(x, y), T(x, y)]); segs.push([R(x, y), B(x, y)]); break;
        case 6: segs.push([B(x, y), T(x, y)]); break;
        case 7: segs.push([L(x, y), T(x, y)]); break;
        case 8: segs.push([T(x, y), L(x, y)]); break;
        case 9: segs.push([T(x, y), B(x, y)]); break;
        case 10: segs.push([T(x, y), R(x, y)]); segs.push([B(x, y), L(x, y)]); break;
        case 11: segs.push([T(x, y), R(x, y)]); break;
        case 12: segs.push([R(x, y), L(x, y)]); break;
        case 13: segs.push([R(x, y), B(x, y)]); break;
        case 14: segs.push([B(x, y), L(x, y)]); break;
      }
    }
  }
  const key = (p) => p[0].toFixed(3) + ',' + p[1].toFixed(3);
  const startMap = new Map();
  segs.forEach((s, i) => startMap.set(key(s[0]), i));
  const used = new Array(segs.length).fill(false);
  const contours = [];
  for (let i = 0; i < segs.length; i++) {
    if (used[i]) continue;
    const poly = [];
    let cur = i, guard = 0;
    while (!used[cur] && guard < segs.length + 5) {
      used[cur] = true;
      poly.push(segs[cur][0]);
      const nextKey = key(segs[cur][1]);
      guard++;
      if (nextKey === key(poly[0])) break;
      const nextIdx = startMap.get(nextKey);
      if (nextIdx === undefined) break;
      cur = nextIdx;
    }
    if (poly.length >= 3) contours.push(poly);
  }
  return contours;
}

function pointLineDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function simplifyPoly(points, epsilon) {
  if (points.length < 3) return points;
  function dp(pts) {
    if (pts.length < 3) return pts;
    let maxDist = 0, index = 0;
    const [x1, y1] = pts[0], [x2, y2] = pts[pts.length - 1];
    for (let i = 1; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i];
      const dist = pointLineDist(x0, y0, x1, y1, x2, y2);
      if (dist > maxDist) { maxDist = dist; index = i; }
    }
    if (maxDist > epsilon) {
      const left = dp(pts.slice(0, index + 1));
      const right = dp(pts.slice(index));
      return left.slice(0, -1).concat(right);
    }
    return [pts[0], pts[pts.length - 1]];
  }
  return dp(points);
}

function buildGlyphPath(contours, size, unitsPerEm) {
  const path = new opentype.Path();
  const scale = unitsPerEm / size;
  for (const contour of contours) {
    contour.forEach(([x, y], i) => {
      const fx = x * scale;
      const fy = unitsPerEm - y * scale;
      if (i === 0) path.moveTo(fx, fy); else path.lineTo(fx, fy);
    });
    path.close();
  }
  return path;
}

async function buildBlendedFont() {
  const text = letterInput.value || 'A';
  const chars = [...new Set(text.split(''))].filter((c) => c !== ' ');
  const size = 400;
  const unitsPerEm = 1000;
  const t = blendSlider.value / 100;

  const notdef = new opentype.Glyph({ name: '.notdef', unicode: 0, advanceWidth: unitsPerEm * 0.6, path: new opentype.Path() });
  const space = new opentype.Glyph({ name: 'space', unicode: 32, advanceWidth: unitsPerEm * 0.5, path: new opentype.Path() });
  const glyphs = [notdef, space];

  for (const ch of chars) {
    const maskA = glyphMaskForFont(state.fontA, ch, size);
    const maskB = glyphMaskForFont(state.fontB, ch, size);
    const merged = mergedMask(maskA, maskB, size, t);
    const contours = traceContours(merged, size).map((c) => simplifyPoly(c, 1.5));
    const path = buildGlyphPath(contours, size, unitsPerEm);
    glyphs.push(new opentype.Glyph({
      name: 'uni' + ch.codePointAt(0).toString(16).toUpperCase(),
      unicode: ch.codePointAt(0),
      advanceWidth: unitsPerEm,
      path,
    }));
  }

  return new opentype.Font({
    familyName: 'SriftuMisinys',
    styleName: 'Regular',
    unitsPerEm,
    ascender: unitsPerEm * 0.8,
    descender: -unitsPerEm * 0.2,
    glyphs,
  });
}

exportBtn.addEventListener('click', async () => {
  if (!state.fontA || !state.fontB) return;
  exportBtn.disabled = true;
  exportStatus.textContent = 'Kuriamas šriftas...';
  try {
    const font = await buildBlendedFont();
    const buffer = font.toArrayBuffer();
    const blob = new Blob([buffer], { type: 'font/otf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'sriftu-misinys.otf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    exportStatus.textContent = 'Atsisiųsta: sriftu-misinys.otf';
  } catch (err) {
    exportStatus.textContent = 'Klaida: ' + err.message;
  }
  exportBtn.disabled = false;
});
</script>

</body>
</html>
