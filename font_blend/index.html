<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8" />
<title>Šriftų maišyklė — Alyvų g. 4</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem;
    background: #fafafa;
    color: #111;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #111; color: #eee; }
    .card { background: #1c1c1c !important; border-color: #333 !important; }
    input[type=text] { background: #222; color: #eee; border-color: #444; }
  }
  h1 { font-size: 1.4rem; }
  p.sub { opacity: .75; margin-top: -.5rem; }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
  }
  label { display: block; font-weight: 600; margin-bottom: .3rem; }
  input[type=text], input[type=range], select { width: 100%; padding: .35rem; }
  select { padding: .5rem; border-radius: 6px; border: 1px solid #ccc; background: #fff; color: #111; }
  @media (prefers-color-scheme: dark) { select { background: #222; color: #eee; border-color: #444; } }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  canvas { background: #fff; border: 1px solid #ccc; border-radius: 6px; max-width: 100%; }
  .canvases { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-start; }
  .canvases figure { margin: 0; text-align: center; }
  figcaption { font-size: .85rem; opacity: .7; margin-top: .3rem; }
  button {
    background: #6b4e9a; color: #fff; border: 0; border-radius: 6px;
    padding: .55rem 1rem; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #status { font-size: .85rem; opacity: .75; min-height: 1.2em; }
</style>
</head>
<body>

<h1>Šriftų maišyklė</h1>
<p class="sub">Sumaišyk dviejų žmonių rašysenos (ar bet kokius) šriftus į vieną simbolį — pvz., raidę iš „Alyvų g. 4“.</p>

<div class="card">
  <div class="row">
    <div>
      <label for="fontA">1-as šriftas</label>
      <select id="fontA"></select>
    </div>
    <div>
      <label for="fontB">2-as šriftas</label>
      <select id="fontB"></select>
    </div>
  </div>
</div>

<div class="card">
  <div class="row">
    <div>
      <label for="letter">Raidė / žodis</label>
      <input type="text" id="letter" value="A" maxlength="12" />
    </div>
    <div>
      <label for="blend">Maišymo santykis (0 = 1-as šriftas, 1 = 2-as šriftas)</label>
      <input type="range" id="blend" min="0" max="100" value="50" />
      <div id="blendVal" style="text-align:center;font-size:.85rem;opacity:.75;">50%</div>
    </div>
  </div>
  <button id="renderBtn" disabled>Maišyti</button>
  <div id="status"></div>
</div>

<div class="canvases">
  <figure><canvas id="cA" width="300" height="300"></canvas><figcaption>1-as šriftas</figcaption></figure>
  <figure><canvas id="cB" width="300" height="300"></canvas><figcaption>2-as šriftas</figcaption></figure>
  <figure><canvas id="cMix" width="300" height="300"></canvas><figcaption>Mišinys (raudona = 1-as, mėlyna = 2-as, violetinė = persidengimas)</figcaption></figure>
</div>

<script>
const state = { fontA: null, fontB: null };
const status = document.getElementById('status');
const renderBtn = document.getElementById('renderBtn');
const blendSlider = document.getElementById('blend');
const blendVal = document.getElementById('blendVal');
const letterInput = document.getElementById('letter');

function setStatus(msg) { status.textContent = msg; }

// Curated list of Google Fonts (raw TTF files from the google/fonts repo — opentype.js
// can't decode WOFF2, which is all the fonts.googleapis.com CSS endpoint serves to browsers).
const RAW_BASE = 'https://raw.githubusercontent.com/google/fonts/main/';
const FONT_LIST = [
  ['Caveat', 'ofl/caveat/Caveat%5Bwght%5D.ttf'],
  ['Dancing Script', 'ofl/dancingscript/DancingScript%5Bwght%5D.ttf'],
  ['Pacifico', 'ofl/pacifico/Pacifico-Regular.ttf'],
  ['Shadows Into Light', 'ofl/shadowsintolight/ShadowsIntoLight.ttf'],
  ['Indie Flower', 'ofl/indieflower/IndieFlower-Regular.ttf'],
  ['Amatic SC', 'ofl/amaticsc/AmaticSC-Regular.ttf'],
  ['Courgette', 'ofl/courgette/Courgette-Regular.ttf'],
  ['Great Vibes', 'ofl/greatvibes/GreatVibes-Regular.ttf'],
  ['Kalam', 'ofl/kalam/Kalam-Regular.ttf'],
  ['Permanent Marker', 'apache/permanentmarker/PermanentMarker-Regular.ttf'],
  ['Allura', 'ofl/allura/Allura-Regular.ttf'],
  ['Reenie Beanie', 'ofl/reeniebeanie/ReenieBeanie.ttf'],
  ['Architects Daughter', 'ofl/architectsdaughter/ArchitectsDaughter-Regular.ttf'],
  ['Parisienne', 'ofl/parisienne/Parisienne-Regular.ttf'],
  ['Sacramento', 'ofl/sacramento/Sacramento-Regular.ttf'],
  ['Playfair Display', 'ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf'],
  ['Merriweather', 'ofl/merriweather/Merriweather%5Bopsz,wdth,wght%5D.ttf'],
  ['Roboto', 'ofl/roboto/Roboto%5Bwdth,wght%5D.ttf'],
  ['Montserrat', 'ofl/montserrat/Montserrat%5Bwght%5D.ttf'],
  ['Bebas Neue', 'ofl/bebasneue/BebasNeue-Regular.ttf'],
  ['Oswald', 'ofl/oswald/Oswald%5Bwght%5D.ttf'],
  ['Lobster', 'ofl/lobster/Lobster-Regular.ttf'],
  ['Cinzel', 'ofl/cinzel/Cinzel%5Bwght%5D.ttf'],
  ['Abril Fatface', 'ofl/abrilfatface/AbrilFatface-Regular.ttf'],
  ['Patrick Hand', 'ofl/patrickhand/PatrickHand-Regular.ttf'],
  ['Gochi Hand', 'ofl/gochihand/GochiHand-Regular.ttf'],
];

const fontCache = {};

async function fetchGoogleFont(family) {
  if (fontCache[family]) return fontCache[family];
  const entry = FONT_LIST.find(([name]) => name === family);
  if (!entry) throw new Error('Nežinomas šriftas');
  const res = await fetch(RAW_BASE + entry[1]);
  if (!res.ok) throw new Error('Nepavyko atsisiųsti šrifto failo (' + res.status + ')');
  const buf = await res.arrayBuffer();
  const font = opentype.parse(buf);
  fontCache[family] = font;
  return font;
}

function populateFontSelect(select) {
  for (const [family] of FONT_LIST) {
    const opt = document.createElement('option');
    opt.value = family;
    opt.textContent = family;
    select.appendChild(opt);
  }
}

function loadFontChoice(select, key, canvasId, defaultFamily) {
  populateFontSelect(select);
  select.value = defaultFamily;

  async function load() {
    const family = select.value;
    setStatus(`Kraunama: ${family}...`);
    try {
      const font = await fetchGoogleFont(family);
      state[key] = font;
      drawSingle(font, document.getElementById(canvasId));
      setStatus(`Įkelta: ${family}`);
    } catch (err) {
      setStatus('Klaida kraunant šriftą: ' + err.message);
    }
    renderBtn.disabled = !(state.fontA && state.fontB);
    if (state.fontA && state.fontB) render();
  }

  select.addEventListener('change', load);
  load();
}
loadFontChoice(document.getElementById('fontA'), 'fontA', 'cA', 'Caveat');
loadFontChoice(document.getElementById('fontB'), 'fontB', 'cB', 'Dancing Script');

function glyphMaskForFont(font, text, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  ctx.fillStyle = '#000';

  const fontSize = size * 0.7;
  const path = font.getPath(text, 0, 0, fontSize);
  const bbox = path.getBoundingBox();
  const w = bbox.x2 - bbox.x1, h = bbox.y2 - bbox.y1;
  const scale = Math.min((size * 0.8) / w, (size * 0.8) / h) || 1;
  const tx = size / 2 - (bbox.x1 + w / 2) * scale;
  const ty = size / 2 - (bbox.y1 + h / 2) * scale;

  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(scale, scale);
  path.fill = '#000';
  const p2d = new Path2D(path.toPathData(2));
  ctx.fill(p2d);
  ctx.restore();

  const data = ctx.getImageData(0, 0, size, size).data;
  const mask = new Uint8Array(size * size);
  for (let i = 0; i < size * size; i++) mask[i] = data[i * 4 + 3] > 127 ? 1 : 0;
  return mask;
}

function drawSingle(font, canvas) {
  const size = canvas.width;
  const mask = glyphMaskForFont(font, letterInput.value || 'A', size);
  paintMask(canvas, mask, size);
}

function paintMask(canvas, mask, size) {
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = mask[i] ? 20 : 255;
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// Double-exposure overlay: font A tinted warm, font B tinted cool, overlap reads as ink-mixed.
// This stays legible for any pair of fonts, unlike a pixel morph which only works when both
// glyphs share similar structure.
const COLOR_A = [196, 90, 60];   // warm terracotta
const COLOR_B = [60, 110, 196];  // cool blue

function paintOverlay(canvas, maskA, maskB, size, t) {
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const opA = (1 - t) * 0.85 + 0.15;
  const opB = t * 0.85 + 0.15;
  for (let i = 0; i < size * size; i++) {
    let r = 255, g = 255, b = 255;
    if (maskA[i]) {
      r = r * (1 - opA) + COLOR_A[0] * opA;
      g = g * (1 - opA) + COLOR_A[1] * opA;
      b = b * (1 - opA) + COLOR_A[2] * opA;
    }
    if (maskB[i]) {
      r = r * (1 - opB) + COLOR_B[0] * opB;
      g = g * (1 - opB) + COLOR_B[1] * opB;
      b = b * (1 - opB) + COLOR_B[2] * opB;
    }
    img.data[i * 4] = Math.round(r);
    img.data[i * 4 + 1] = Math.round(g);
    img.data[i * 4 + 2] = Math.round(b);
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

function render() {
  if (!state.fontA || !state.fontB) return;
  const text = letterInput.value || 'A';
  const size = 300;
  setStatus('Skaičiuojama...');
  requestAnimationFrame(() => {
    const maskA = glyphMaskForFont(state.fontA, text, size);
    const maskB = glyphMaskForFont(state.fontB, text, size);
    paintMask(document.getElementById('cA'), maskA, size);
    paintMask(document.getElementById('cB'), maskB, size);

    const t = blendSlider.value / 100;
    paintOverlay(document.getElementById('cMix'), maskA, maskB, size, t);
    setStatus('Paruošta.');
  });
}

blendSlider.addEventListener('input', () => {
  blendVal.textContent = blendSlider.value + '%';
  render();
});
letterInput.addEventListener('input', render);
renderBtn.addEventListener('click', render);
</script>

</body>
</html>
